[project]
name = "auto-label-project"
version = "0.1.0"
description = "Automated annotation DAG scaffold for generated and direct labeling workflows."
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
  "openai>=1.0.0",
  "PyYAML>=6.0.0",
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "lpips>=0.1.4"
]

[tool.unittest]
start-dir = "tests"
