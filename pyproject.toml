[project]
name = "auto-label-project"
version = "0.1.0"
description = "Automated annotation DAG scaffold for generated and direct labeling workflows."
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0.0",
  "openai>=1.0.0",
  "PyYAML>=6.0.0",
  "requests>=2.31.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0"
]

[tool.unittest]
start-dir = "tests"
